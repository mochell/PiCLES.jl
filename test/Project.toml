[deps]
IfElse = "615f187c-cbe4-4ef1-ba3b-2fcf58d6d173"
Oceananigans = "9e8cae18-63c1-5223-a75c-80ca9d6e9a09"
SharedArrays = "1a1011a3-84de-559e-8e89-a11a2f7dc383"
StaticArrays = "90137ffa-7385-5640-81b9-e52037218182"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

# Plots is loaded transitively (PiCLES → Utils/ParticleTools, visualization/Plotting).
# `Pkg.test` builds the sandbox from this file, so Plots is named here and its
# precompile workload is disabled directly. Plots' example-gallery workload throws
# a `floatrange` MethodError on Linux x86_64 under Julia 1.10.11, which otherwise
# aborts precompilation of PiCLES before any test runs. The workload only warms up
# first-call latency, so disabling it is safe and changes no results.
[extras]
Plots = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"

[preferences.Plots]
precompile_workload = false
